<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 10px;
    }
    #summarizeBtn {
      text-align: center;
      color: white;
      height: 30px;
      width: 50%;
      background: #009578;
      border: none;
      outline: none;
      border-radius: 5px;
      font-family: "Quicksand", sans-serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 25%;
    }

    #summarizeBtn:hover {
      background: #008168;
    }

    #summarizeBtn:active {
      background: #006e58;
    }


    #expandPostsBtn {
      text-align: center;
      color: white;
      height: 30px;
      width: 50%;
      background: #009578;
      border: none;
      outline: none;
      border-radius: 5px;
      font-family: "Quicksand", sans-serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 25%;
    }

    #expandPostsBtn:hover {
      background: #008168;
    }

    #expandPostsBtn:active {
      background: #006e58;
    }

    #summary {
      margin-top: 10px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <button id="expandPostsBtn">Expand Posts</button>
  <button id="summarizeBtn">Summarize</button>
  <div id="summary"></div>
  <script src="popup.js"></script>
</body>
</html>
